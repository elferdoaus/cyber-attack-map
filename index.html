<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Attack Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #12213d 0%, #08101d 45%, #04070d 100%);
      color: white;
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 22px 20px 18px 20px;
      background: rgba(10, 18, 32, 0.88);
      border-bottom: 1px solid rgba(0, 255, 255, 0.15);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.08);
      position: relative;
      z-index: 1000;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.35);
    }

    p {
      margin-top: 8px;
      color: #b9c8db;
      font-size: 14px;
    }

    #infos {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 14px 16px;
      background: rgba(8, 16, 29, 0.92);
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(0, 255, 255, 0.12);
      position: relative;
      z-index: 1000;
    }

    .box {
      background: linear-gradient(180deg, rgba(18, 34, 56, 0.95), rgba(10, 19, 32, 0.95));
      border: 1px solid rgba(0, 255, 255, 0.12);
      padding: 12px 22px;
      border-radius: 14px;
      min-width: 170px;
      text-align: center;
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.08);
    }

    .small {
      font-size: 12px;
      color: #8fa7c4;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 6px;
      color: #e9f7ff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.18);
    }

    #map {
      height: calc(100vh - 176px);
      width: 100%;
      filter: brightness(0.9) saturate(1.1);
    }

    .leaflet-container {
      background: #050b14;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cyber Attack Map</h1>
    <p>Mini projet de visualisation de cyberattaques simulées en temps réel</p>
  </header>

  <div id="infos">
    <div class="box">
      <div class="small">Attacks</div>
      <div class="number" id="attackCount">0</div>
    </div>

    <div class="box">
      <div class="small">Source</div>
      <div class="number" id="sourceCountry">-</div>
    </div>

    <div class="box">
      <div class="small">Target</div>
      <div class="number" id="targetCountry">-</div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    var attackCount = 0;

    var countries = [
      { name: 'USA', coords: [37.0902, -95.7129] },
      { name: 'France', coords: [46.2276, 2.2137] },
      { name: 'Germany', coords: [51.1657, 10.4515] },
      { name: 'Brazil', coords: [-14.2350, -51.9253] },
      { name: 'India', coords: [20.5937, 78.9629] },
      { name: 'Japan', coords: [36.2048, 138.2529] },
      { name: 'Australia', coords: [-25.2744, 133.7751] },
      { name: 'Canada', coords: [56.1304, -106.3468] },
      { name: 'UK', coords: [55.3781, -3.4360] },
      { name: 'South Korea', coords: [35.9078, 127.7669] }
    ];

    function randomCountry() {
      var index = Math.floor(Math.random() * countries.length);
      return countries[index];
    }

    function updateInfos(source, target) {
      attackCount = attackCount + 1;
      document.getElementById('attackCount').textContent = attackCount;
      document.getElementById('sourceCountry').textContent = source.name;
      document.getElementById('targetCountry').textContent = target.name;
    }

    function createAttack() {
      var source = randomCountry();
      var target = randomCountry();

      while (source.name === target.name) {
        target = randomCountry();
      }

      var sourceMarker = L.circleMarker(source.coords, {
        radius: 7,
        color: '#ff3b3b',
        fillColor: '#ff3b3b',
        fillOpacity: 1,
        weight: 2
      }).addTo(map);

      var targetMarker = L.circleMarker(target.coords, {
        radius: 7,
        color: '#00ffe1',
        fillColor: '#00ffe1',
        fillOpacity: 1,
        weight: 2
      }).addTo(map);

      var attackLine = L.polyline([source.coords, target.coords], {
        color: '#00d9ff',
        weight: 2.5,
        opacity: 0.85
      }).addTo(map);

      updateInfos(source, target);

      sourceMarker.bindPopup('Attack source: ' + source.name);
      targetMarker.bindPopup('Target: ' + target.name);

      setTimeout(function () {
        map.removeLayer(sourceMarker);
        map.removeLayer(targetMarker);
        map.removeLayer(attackLine);
      }, 2000);
    }

    setInterval(createAttack, 1200);
  </script>
</body>
</html>
