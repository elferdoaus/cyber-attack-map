<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Attack Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a1320;
color:white;
}

header{
text-align:center;
padding:15px;
background:#0d1828;
border-bottom:1px solid rgba(255,255,255,0.1);
}

#map{
height:100vh;
width:100%;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:10px;
padding:10px;
margin:5px;
}

</style>
</head>

<body>

<header>
<h1>Cyber Attack Map</h1>
<p>Threat activity detected</p>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map',{
minZoom:1,
maxZoom:8,
zoomSnap:0.25,
maxBounds:[[-90,-200],[90,200]],
maxBoundsViscosity:0
}).setView([20,0],2);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
noWrap:true,
attribution:'© OpenStreetMap'
}).addTo(map);



/* bouton reset vue monde */

var resetButton = L.control({position:'topleft'});

resetButton.onAdd = function(){

var div = L.DomUtil.create('div','leaflet-bar');

div.style.background='white';
div.style.padding='6px 10px';
div.style.cursor='pointer';
div.innerHTML='🌍';

div.onclick=function(){
map.setView([20,0],2);
};

return div;

};

resetButton.addTo(map);



/* capitales */

var capitals=[

["France","Paris",48.85,2.35],
["Germany","Berlin",52.52,13.40],
["United States","Washington",38.90,-77.03],
["Russia","Moscow",55.75,37.61],
["China","Beijing",39.90,116.40],
["Japan","Tokyo",35.67,139.65],
["India","New Delhi",28.61,77.20],
["Saudi Arabia","Riyadh",24.71,46.67],
["United Kingdom","London",51.50,-0.12],
["Brazil","Brasilia",-15.79,-47.88]

];

capitals.forEach(function(c){

L.circleMarker([c[2],c[3]],{
radius:4,
color:"#7a8da6",
fillColor:"#7a8da6",
fillOpacity:1
}).addTo(map);

});



/* données attaques */

var attackTypes=[
"DDoS",
"Malware",
"Phishing",
"Ransomware",
"Brute Force"
];



function random(arr){
return arr[Math.floor(Math.random()*arr.length)];
}



function attack(){

var source=random(capitals);
var target=random(capitals);

if(source==target) return;



var line=L.polyline([
[source[2],source[3]],
[target[2],target[3]]
],
{
color:"#40f5ff",
weight:2
}).addTo(map);



var s=L.circleMarker(
[source[2],source[3]],
{radius:7,color:"#ff4d4d",fillColor:"#ff4d4d",fillOpacity:1}
).addTo(map);



var t=L.circleMarker(
[target[2],target[3]],
{radius:7,color:"#40f5ff",fillColor:"#40f5ff",fillOpacity:1}
).addTo(map);



setTimeout(function(){

map.removeLayer(line);
map.removeLayer(s);
map.removeLayer(t);

},2000);

}



setInterval(attack,1200);



/* chargement des pays */

var selectedCountryLayer=null;

function defaultStyle(){
return{
color:"#8fa2b7",
weight:1,
fillColor:"#dfe8ef",
fillOpacity:0.15
};
}

function selectedStyle(){
return{
color:"#333",
weight:2,
fillColor:"#888",
fillOpacity:0.5
};
}



fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json")

.then(res=>res.json())

.then(data=>{

var layer=L.geoJSON(data,{

style:defaultStyle,

onEachFeature:function(feature,l){

l.on("click",function(){

if(selectedCountryLayer){
selectedCountryLayer.setStyle(defaultStyle());
}

l.setStyle(selectedStyle());
selectedCountryLayer=l;

map.fitBounds(l.getBounds(),{maxZoom:4});

});

}

}).addTo(map);

});


</script>

</body>
</html>
