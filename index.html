<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Attack Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08101b;
      color: white;
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 18px 20px 14px 20px;
      background: rgba(9, 17, 29, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 1000;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    p {
      margin: 8px 0 0 0;
      color: #b9c4d1;
      font-size: 14px;
    }

    #alertBar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: #111d2e;
      color: #7ef9ff;
      font-size: 13px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(126, 249, 255, 0.15);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 10px #ff4d4d;
      animation: pulse 1.2s infinite;
    }

    #infos {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 14px;
      background: rgba(12, 22, 36, 0.98);
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 1000;
    }

    .box {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 20px;
      border-radius: 12px;
      min-width: 170px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 14px rgba(0, 0, 0, 0.2);
    }

    .small {
      font-size: 12px;
      color: #97a9bd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 6px;
      color: white;
    }

    #map {
      height: calc(100vh - 196px);
      width: 100%;
      background: #b9d8f3;
    }

    .leaflet-container {
      background: #b9d8f3;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.7;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .attack-point {
      animation: showPoint 0.5s ease;
    }

    @keyframes showPoint {
      from {
        transform: scale(0.3);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Cyber Attack Map</h1>
    <p>Mini projet de visualisation de cyberattaques simulées en temps réel</p>
  </header>

  <div id="alertBar">
    <div class="dot"></div>
    <div>Threat activity detected</div>
  </div>

  <div id="infos">
    <div class="box">
      <div class="small">Live attacks</div>
      <div class="number" id="attackCount">0</div>
    </div>

    <div class="box">
      <div class="small">Source</div>
      <div class="number" id="sourceCountry">-</div>
    </div>

    <div class="box">
      <div class="small">Target</div>
      <div class="number" id="targetCountry">-</div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map', {
      worldCopyJump: false,
      maxBounds: [[-85, -180], [85, 180]],
      maxBoundsViscosity: 1.0,
      minZoom: 2,
      maxZoom: 4,
      zoomControl: true
    }).setView([20, 0], 2);

    map.setMaxBounds([[-85, -180], [85, 180]]);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      noWrap: true,
      bounds: [[-85, -180], [85, 180]]
    }).addTo(map);

    var attackCount = 0;

    var countries = [
      { name: 'USA', coords: [37.0902, -95.7129] },
      { name: 'France', coords: [46.2276, 2.2137] },
      { name: 'Germany', coords: [51.1657, 10.4515] },
      { name: 'Brazil', coords: [-14.235, -51.9253] },
      { name: 'India', coords: [20.5937, 78.9629] },
      { name: 'Japan', coords: [36.2048, 138.2529] },
      { name: 'Australia', coords: [-25.2744, 133.7751] },
      { name: 'Canada', coords: [56.1304, -106.3468] },
      { name: 'United Kingdom', coords: [55.3781, -3.436] },
      { name: 'South Korea', coords: [35.9078, 127.7669] },
      { name: 'China', coords: [35.8617, 104.1954] },
      { name: 'Russia', coords: [61.524, 105.3188] },
      { name: 'Spain', coords: [40.4637, -3.7492] },
      { name: 'Italy', coords: [41.8719, 12.5674] },
      { name: 'Turkey', coords: [38.9637, 35.2433] },
      { name: 'Saudi Arabia', coords: [23.8859, 45.0792] },
      { name: 'South Africa', coords: [-30.5595, 22.9375] },
      { name: 'Mexico', coords: [23.6345, -102.5528] },
      { name: 'Argentina', coords: [-38.4161, -63.6167] },
      { name: 'Indonesia', coords: [-0.7893, 113.9213] }
    ];

    function randomCountry() {
      var index = Math.floor(Math.random() * countries.length);
      return countries[index];
    }

    function updateInfos(source, target) {
      attackCount = attackCount + 1;
      document.getElementById('attackCount').textContent = attackCount;
      document.getElementById('sourceCountry').textContent = source.name;
      document.getElementById('targetCountry').textContent = target.name;
    }

    function createGlowLine(points) {
      var glowLine = L.polyline(points, {
        color: '#7df9ff',
        weight: 7,
        opacity: 0.18,
        interactive: false
      }).addTo(map);
      return glowLine;
    }

    function createAttack() {
      var source = randomCountry();
      var target = randomCountry();

      while (source.name === target.name) {
        target = randomCountry();
      }

      var sourceMarker = L.circleMarker(source.coords, {
        radius: 7,
        color: '#ff4d4d',
        fillColor: '#ff4d4d',
        fillOpacity: 1,
        weight: 2,
        className: 'attack-point'
      }).addTo(map);

      var targetMarker = L.circleMarker(target.coords, {
        radius: 7,
        color: '#40f5ff',
        fillColor: '#40f5ff',
        fillOpacity: 1,
        weight: 2,
        className: 'attack-point'
      }).addTo(map);

      var glowLine = createGlowLine([source.coords, target.coords]);

      var attackLine = L.polyline([source.coords, target.coords], {
        color: '#40f5ff',
        weight: 2.5,
        opacity: 0.95
      }).addTo(map);

      updateInfos(source, target);

      setTimeout(function () {
        map.removeLayer(sourceMarker);
        map.removeLayer(targetMarker);
        map.removeLayer(glowLine);
        map.removeLayer(attackLine);
      }, 2200);
    }

    setInterval(createAttack, 1000);
  </script>
</body>
</html>
